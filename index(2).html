<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOLTAR SHOP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#12060a;--card:rgba(255,255,255,.05);--line:rgba(255,80,110,.22);--red:#ff2d55;--red2:#c4143b;--text:#fbeef1;--hint:#b99aa2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#4a0d1e 0%,var(--bg) 60%) fixed;padding:16px 14px 110px;min-height:100vh}
#splash{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.logo{font-size:46px;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#ff5a7a 60%,#c4143b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:800;letter-spacing:.5em;color:var(--hint);margin:2px 0 26px .5em}
.bar{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);animation:load 1.3s ease-out forwards}
@keyframes load{to{width:100%}}
h1{font-size:26px;margin:6px 4px 4px;font-weight:900}
.lead{color:var(--hint);margin:0 4px 16px;font-size:14px}
.card{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px)}
.card.tap:active{transform:scale(.985)}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,var(--red),var(--red2));flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:700;font-size:17px}
.d{color:var(--hint);font-size:13.5px}
.p{font-weight:800;white-space:nowrap}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:34px;height:34px;border:0;border-radius:50%;font-size:20px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2))}
.qty button:disabled{opacity:.3}
.qty span{min-width:20px;text-align:center;font-weight:700}
nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:7px;border-radius:26px;background:rgba(40,10,18,.88);border:1px solid var(--line);backdrop-filter:blur(14px)}
nav button{flex:1;border:0;background:none;color:var(--hint);font-weight:800;font-size:12.5px;padding:11px 0;border-radius:20px}
nav button.on{color:#fff;background:linear-gradient(145deg,var(--red),var(--red2))}
.empty{text-align:center;color:var(--hint);padding:50px 0}
.in{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;margin-bottom:12px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(145deg,var(--red),var(--red2));margin-bottom:10px}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.lb{display:block;color:var(--hint);font-size:13px;margin:0 4px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-weight:700;font-size:14px}
.chip.on{background:linear-gradient(145deg,var(--red),var(--red2));border-color:transparent}
.card.col{display:block}.card.col .chips{margin:12px 0 0}
.sec{margin:6px 4px 10px;font-size:16px}
</style>
</head>
<body>
<div id="splash"><div class="logo">VOLTAR</div><div class="sub">SHOP</div><div class="bar"><i></i></div></div>
<main id="view"></main>
<nav id="nav"></nav>
<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
try { tg.setHeaderColor("#12060a"); tg.setBackgroundColor("#12060a"); } catch (e) {}

const params = new URLSearchParams(location.search);
const api = (params.get("api") || "").replace(/\/$/, "");
let catalog = [], admin = false, token = null, adminItems = {}, editing = {}, adminView = null;
const cart = {};
const PL = { mobile: "📱 Mobile", pc: "💻 PC" };
const picks = c => (c === "both" ? ["mobile", "pc"] : [c]);
const cost = (p, c) => picks(c).reduce((s, pl) => s + (p.o[pl] || 0), 0);
const lowest = ps => Math.min(...ps.flatMap(p => Object.values(p.o)));
let tab = "shop", cat = null;
const view = document.getElementById("view"), nav = document.getElementById("nav");
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const money = n => "$" + Math.round(n * 100) / 100;
const ICONS = ["💎", "🔒", "🎙", "🙂", "⭐", "🎬", "🎨", "⚡"];
const warn = m => (tg.showAlert ? tg.showAlert(m) : alert(m));

function blob() {
  try {
    let b = params.get("c").replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0))));
  } catch (e) { return []; }
}
async function loadCatalog() {
  if (api) { try { catalog = await (await fetch(api + "/api/catalog")).json(); return; } catch (e) {} }
  catalog = blob();
}
async function call(path, body, auth) {
  const r = await fetch(api + path, {
    method: body ? "POST" : "GET",
    headers: Object.assign({ "Content-Type": "application/json" }, auth && token ? { Authorization: "Bearer " + token } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && auth) { token = null; adminView = "login"; render(); }
    throw new Error(j.error || "Request failed");
  }
  return j;
}
const loadAdmin = async () => { adminItems = await call("/api/admin/products", null, true); };

function shop() {
  if (cat === null) {
    view.append(h("h1", "", "VOLTAR SHOP"), h("p", "lead", "Digital goods. Files arrive in the bot chat after payment."));
    const groups = [...new Set(catalog.map(p => p.k))];
    if (!groups.length) return view.append(h("div", "empty", "No products yet."));
    groups.forEach((g, i) => {
      const items = catalog.filter(p => p.k === g), c = h("div", "card tap"), info = h("div", "grow");
      info.append(h("div", "t", g), h("div", "d", items.length + (items.length > 1 ? " items" : " item")));
      c.append(h("div", "ico", ICONS[i % ICONS.length]), info, h("div", "p", "from " + money(lowest(items))));
      c.onclick = () => { cat = g; render(); };
      view.append(c);
    });
    return;
  }
  view.append(h("h1", "", cat));
  catalog.filter(p => p.k === cat).forEach(p => {
    const avail = Object.keys(p.o), c = h("div", "card col");
    if (!avail.length) return;
    c.append(h("div", "t", p.n), h("div", "d", p.d));
    const opts = avail.length === 2 ? ["mobile", "pc", "both"] : avail;
    const chips = h("div", "chips");
    opts.forEach(k => {
      const name = k === "both" ? "Both" : PL[k] + (avail.length === 1 ? " only" : "");
      const b = h("button", "chip" + (cart[p.id] === k ? " on" : ""), name + " · " + money(cost(p, k)));
      b.onclick = () => { cart[p.id] === k ? delete cart[p.id] : (cart[p.id] = k); render(); };
      chips.append(b);
    });
    c.append(chips);
    view.append(c);
  });
}

function adminLogin() {
  view.append(h("h1", "", "Admin"), h("p", "lead", "Enter your admin password."));
  const pw = h("input", "in"); pw.type = "password"; pw.autocomplete = "off"; pw.placeholder = "Password";
  const btn = h("button", "btn", "Unlock");
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      token = (await call("/api/login", { initData: tg.initData, password: pw.value })).token;
      await loadAdmin(); adminView = "list";
    } catch (e) { warn(e.message); }
    render();
  };
  view.append(pw, btn);
}

function adminList() {
  view.append(h("h1", "", "Items"));
  Object.entries(adminItems).forEach(([id, p]) => {
    const c = h("div", "card tap"), info = h("div", "grow");
    info.append(h("div", "t", p.name), h("div", "d", p.cat + " · " + Object.entries(p.opts).map(([k, o]) => PL[k] + " " + money(o.price)).join("  ")));
    c.onclick = () => { editing = JSON.parse(JSON.stringify(Object.assign({ id }, p))); adminView = "edit"; render(); };
    view.append(c);
  });
  const add = h("button", "btn", "+ Add item");
  add.onclick = () => { editing = {}; adminView = "edit"; render(); };
  const lock = h("button", "btn ghost", "Lock admin");
  lock.onclick = () => { token = null; adminView = null; render(); };
  view.append(add, lock);
}

function adminEdit() {
  const d = editing;
  d.opts = d.opts || {};
  view.append(h("h1", "", d.id ? "Edit item" : "New item"));
  [["name", "Name"], ["cat", "Category"], ["desc", "Description"]].forEach(([k, l]) => {
    const i = h("input", "in"); i.value = d[k] ?? ""; i.oninput = () => { d[k] = i.value; };
    view.append(h("label", "lb", l), i);
  });
  view.append(h("label", "lb", "Available on (tap to turn on or off)"));
  const row = h("div", "chips");
  Object.keys(PL).forEach(pl => {
    const b = h("button", "chip" + (d.opts[pl] ? " on" : ""), PL[pl]);
    b.onclick = () => { d.opts[pl] ? delete d.opts[pl] : (d.opts[pl] = { price: "", deliver: "" }); render(); };
    row.append(b);
  });
  view.append(row);
  Object.keys(PL).filter(pl => d.opts[pl]).forEach(pl => {
    const o = d.opts[pl];
    const pr = h("input", "in"); pr.inputMode = "decimal"; pr.value = o.price; pr.oninput = () => { o.price = pr.value; };
    const dv = h("textarea", "in"); dv.rows = 3; dv.value = o.deliver; dv.oninput = () => { o.deliver = dv.value; };
    view.append(h("h3", "sec", PL[pl]), h("label", "lb", "Price (USD)"), pr,
      h("label", "lb", "Delivery: text or link, or a file code sent to you by the bot"), dv);
  });
  const save = h("button", "btn", "Save");
  save.onclick = async () => {
    save.disabled = true;
    try {
      await call("/api/admin/save", { id: d.id, name: d.name, cat: d.cat, desc: d.desc, opts: d.opts }, true);
      await Promise.all([loadAdmin(), loadCatalog()]);
      adminView = "list";
    } catch (x) { warn(x.message); }
    render();
  };
  view.append(save);
  if (d.id) {
    const del = h("button", "btn ghost", "Delete item");
    del.onclick = () => tg.showConfirm("Delete this item?", async ok => {
      if (!ok) return;
      try {
        await call("/api/admin/delete", { id: d.id }, true);
        await Promise.all([loadAdmin(), loadCatalog()]); adminView = "list";
      } catch (x) { warn(x.message); }
      render();
    });
    view.append(del);
  }
}

function other() {
  const u = (tg.initDataUnsafe || {}).user;
  if (tab === "rewards") return view.append(h("h1", "", "Rewards"), h("p", "lead", "Discounts and bonuses are coming soon."));
  view.append(h("h1", "", u ? u.first_name : "Profile"), h("p", "lead", "Your purchases are in the bot chat. Tap Purchased in the menu."));
  if (admin) {
    const c = h("div", "card tap"), info = h("div", "grow");
    info.append(h("div", "t", "Admin panel"), h("div", "d", "Add and edit items"));
    c.append(h("div", "ico", "🔧"), info);
    c.onclick = async () => {
      if (token) { try { await loadAdmin(); adminView = "list"; } catch (e) { adminView = "login"; } } else adminView = "login";
      render();
    };
    view.append(c);
  }
}

const total = () => catalog.reduce((s, p) => s + (cart[p.id] ? cost(p, cart[p.id]) : 0), 0);

function render() {
  view.replaceChildren(); nav.replaceChildren();
  if (tab === "profile" && adminView) ({ login: adminLogin, list: adminList, edit: adminEdit })[adminView]();
  else tab === "shop" ? shop() : other();
  [["shop", "SHOP"], ["rewards", "REWARDS"], ["profile", "PROFILE"]].forEach(([k, l]) => {
    const b = h("button", tab === k ? "on" : "", l);
    b.onclick = () => { tab = k; cat = null; adminView = null; render(); };
    nav.append(b);
  });
  (tab === "shop" && cat !== null) || adminView ? tg.BackButton.show() : tg.BackButton.hide();
  const t = total();
  t > 0 && !adminView ? tg.MainButton.setParams({ text: "Checkout · " + money(t), color: "#ff2d55", text_color: "#ffffff" }).show() : tg.MainButton.hide();
}

tg.BackButton.onClick(() => {
  if (adminView === "edit") adminView = "list"; else if (adminView) adminView = null; else cat = null;
  render();
});
tg.MainButton.onClick(() => {
  const items = Object.fromEntries(Object.entries(cart));
  tg.sendData(JSON.stringify({ items }));
});

(async () => {
  const wait = new Promise(r => setTimeout(r, 1400));
  await loadCatalog();
  if (api && tg.initData) {
    try { admin = (await call("/api/whoami", { initData: tg.initData })).admin; } catch (e) {}
  }
  render();
  await wait;
  const sp = document.getElementById("splash"); sp.style.opacity = 0; setTimeout(() => sp.remove(), 400);
})();
</script>
</body>
</html>
